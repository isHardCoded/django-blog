<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой блог{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        header h1 {
            margin-bottom: 10px;
        }
        
        nav {
            margin-top: 15px;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            padding: 5px 10px;
            border-radius: 3px;
            transition: background-color 0.3s;
        }
        
        nav a:hover {
            background-color: #34495e;
        }
        
        .search-form {
            margin-top: 15px;
        }
        
        .search-form input[type="text"] {
            padding: 8px;
            width: 300px;
            border: none;
            border-radius: 3px;
        }
        
        .search-form button {
            padding: 8px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .search-form button:hover {
            background-color: #2980b9;
        }
        
        article {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        article h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        article h2 a {
            color: #2c3e50;
            text-decoration: none;
        }
        
        article h2 a:hover {
            color: #3498db;
        }
        
        .article-meta {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        
        .article-meta a {
            color: #3498db;
            text-decoration: none;
        }
        
        .article-meta a:hover {
            text-decoration: underline;
        }
        
        .tags {
            margin-top: 15px;
        }
        
        .tag {
            display: inline-block;
            background-color: #ecf0f1;
            padding: 5px 10px;
            margin-right: 5px;
            margin-bottom: 5px;
            border-radius: 3px;
            font-size: 0.9em;
            text-decoration: none;
            color: #2c3e50;
        }
        
        .tag:hover {
            background-color: #3498db;
            color: white;
        }
        
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .related-articles {
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 5px;
            margin-top: 30px;
        }
        
        .related-articles h3 {
            margin-bottom: 15px;
        }
        
        .related-article {
            background-color: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 3px;
        }
        
        .related-article h4 {
            margin-bottom: 5px;
        }
        
        .related-article h4 a {
            color: #2c3e50;
            text-decoration: none;
        }
        
        .related-article h4 a:hover {
            color: #3498db;
        }
        
        .stats-table {
            width: 100%;
            background-color: white;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .stats-table th,
        .stats-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .stats-table th {
            background-color: #2c3e50;
            color: white;
        }
        
        .stats-table tr:hover {
            background-color: #f8f9fa;
        }
        
        hr {
            border: none;
            border-top: 1px solid #ecf0f1;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Мой блог</h1>
            <nav>
                <a href="{% url 'blog:home' %}">Главная</a>
                <a href="{% url 'blog:authors_stats' %}">Авторы</a>
            </nav>
            <form class="search-form" method="get" action="{% url 'blog:search' %}">
                <input type="text" name="q" placeholder="Поиск статей..." value="{{ query }}">
                <button type="submit">Искать</button>
            </form>
        </div>
    </header>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
